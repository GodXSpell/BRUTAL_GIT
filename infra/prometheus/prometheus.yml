global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'user-profile-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-profile-service:8081']

  - job_name: 'feedback-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['feedback-service:8082']

  - job_name: 'recommendation-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['recommendation-engine:8000']

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:9100']
