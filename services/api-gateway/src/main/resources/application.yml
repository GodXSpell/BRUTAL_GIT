server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-profile-service
          uri: http://user-profile-service:8081
          predicates:
            - Path=/api/v1/me/**, /oauth2/**, /api/v1/auth/**, /login/**
        - id: recommendation-engine
          uri: http://recommendation-engine:8000
          predicates:
            - Path=/api/v1/recommendations/**, /api/v1/embeddings/**
        - id: feedback-service
          uri: http://feedback-service:8082
          predicates:
            - Path=/api/v1/feedback/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

otel:
  sdk:
    disabled: true